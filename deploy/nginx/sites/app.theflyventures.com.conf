# IndexRocket — frontend (Next.js) on https://app.theflyventures.com
# Install to: /etc/nginx/sites-available/indexrocket-app, then symlink into sites-enabled.
# Requires: conf.d/indexrocket-common.conf, snippets/indexrocket-proxy.conf,
#           snippets/indexrocket-tls.conf.
#
# SHARED SERVER: only app.theflyventures.com is handled here. The existing
# theflyventures.com / www.theflyventures.com server blocks are not touched,
# and no `default_server` or socket options are set, so they keep their
# current behaviour.
#
# IPv6: the [::] listens are commented out. Enable them only if the existing
#       sites also listen on [::] AND you create AAAA records (docs §B).
# HTTP/2: follows the existing :443 listener. On Nginx >= 1.25.1 you may add
#       `http2 on;` inside the 443 server block (per-server, safe).

server {
    listen 80;
    # listen [::]:80;
    server_name app.theflyventures.com;

    location /.well-known/acme-challenge/ {
        root /var/www/indexrocket-acme;
    }

    location / {
        return 301 https://app.theflyventures.com$request_uri;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    server_name app.theflyventures.com;

    include snippets/indexrocket-tls.conf;

    # No includeSubDomains: the parent domain theflyventures.com is a separate site.
    add_header Strict-Transport-Security "max-age=63072000" always;
    # CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy and
    # Permissions-Policy are set by Next.js itself (apps/web/next.config.ts).

    client_max_body_size 1m;
    access_log /var/log/nginx/indexrocket-app.access.log ir_safe;

    # Hashed build assets are immutable.
    location /_next/static/ {
        include snippets/indexrocket-proxy.conf;
        proxy_pass http://indexrocket_web;
        expires 1y;
    }

    location / {
        limit_req zone=ir_api burst=40 nodelay;
        include snippets/indexrocket-proxy.conf;
        proxy_pass http://indexrocket_web;
    }
}
