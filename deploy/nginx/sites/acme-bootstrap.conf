# IndexRocket — FIRST certificate issuance only.
# The real IndexRocket site files reference a certificate that does not exist
# yet, so Nginx cannot load them before the first `certbot certonly`. Enable
# this file, issue the certificate, then remove this file and enable the real
# sites. See docs/PRODUCTION.md §9.
#
# Install to: /etc/nginx/sites-available/indexrocket-acme-bootstrap
#
# SHARED SERVER: it only answers for the two new IndexRocket hostnames on
# port 80. The existing theflyventures.com sites are not touched.

server {
    listen 80;
    # listen [::]:80;
    server_name app.theflyventures.com api.theflyventures.com;

    location /.well-known/acme-challenge/ {
        root /var/www/indexrocket-acme;
    }

    location / {
        return 404;
    }
}
