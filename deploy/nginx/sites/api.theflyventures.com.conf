# IndexRocket — API (Express) on https://api.theflyventures.com
# Install to: /etc/nginx/sites-available/indexrocket-api, then symlink into sites-enabled.
# Requires: conf.d/indexrocket-common.conf, snippets/indexrocket-proxy.conf,
#           snippets/indexrocket-tls.conf.
#
# SHARED SERVER: only api.theflyventures.com is handled here; see the notes in
# app.theflyventures.com.conf about IPv6, HTTP/2 and the existing sites.

server {
    listen 80;
    # listen [::]:80;
    server_name api.theflyventures.com;

    location /.well-known/acme-challenge/ {
        root /var/www/indexrocket-acme;
    }

    location / {
        return 301 https://api.theflyventures.com$request_uri;
    }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    server_name api.theflyventures.com;

    include snippets/indexrocket-tls.conf;

    # Strict-Transport-Security and the other security headers are set by the
    # API itself (helmet), so they are not added here (that would duplicate them).

    # Matches the API's JSON body limit; larger bodies are refused at the edge.
    client_max_body_size 1m;
    access_log /var/log/nginx/indexrocket-api.access.log ir_safe;

    # Readiness is for the local supervisor / monitoring, not the internet.
    location = /api/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include snippets/indexrocket-proxy.conf;
        proxy_pass http://indexrocket_api;
    }

    # Credential endpoints get a much tighter limit than the rest of the API.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=ir_auth burst=5 nodelay;
        include snippets/indexrocket-proxy.conf;
        proxy_pass http://indexrocket_api;
    }

    # Includes the Google OAuth callback: /api/auth/google/callback
    location / {
        limit_req zone=ir_api burst=40 nodelay;
        include snippets/indexrocket-proxy.conf;
        proxy_pass http://indexrocket_api;
    }
}
