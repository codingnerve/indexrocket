# IndexRocket — shared Nginx http-context objects.
# Install to: /etc/nginx/conf.d/indexrocket-common.conf
#
# SHARED SERVER: this file is loaded into the same http {} block that serves
# the existing theflyventures.com site. It therefore defines ONLY uniquely named
# objects (ir_* rate-limit zones, the ir_safe log format, indexrocket_* upstreams)
# and NO global directives. TLS settings, server_tokens and limit_req_status are
# set per server in snippets/indexrocket-tls.conf, so:
#   - the existing site's behaviour does not change, and
#   - nothing duplicates a directive nginx.conf already sets in http {}
#     (e.g. Ubuntu's default ssl_protocols), which would make `nginx -t` fail.

# Rate limiting. The app additionally throttles login per account and per IP
# and registration per IP; these zones are the outer, cheap layer.
limit_req_zone $binary_remote_addr zone=ir_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=ir_auth:10m rate=10r/m;

# Access log WITHOUT query strings ($uri, not $request): the OAuth callback URL
# carries a single-use authorization code that must never be written to disk.
log_format ir_safe '$remote_addr [$time_iso8601] $request_id "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent"';

# Production ports: web 3100, API 5101 (both bound to loopback).
upstream indexrocket_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream indexrocket_api {
    server 127.0.0.1:5101;
    keepalive 32;
}
