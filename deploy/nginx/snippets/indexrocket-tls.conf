# IndexRocket — per-server TLS and hardening.
# Install to: /etc/nginx/snippets/indexrocket-tls.conf
# Include inside each IndexRocket `listen 443` server block (never in http {}),
# so the existing sites on this server are unaffected.

# Dedicated certificate for app.theflyventures.com + api.theflyventures.com,
# issued with --cert-name indexrocket (docs/PRODUCTION.md §9). The existing
# theflyventures.com certificate is not used or modified.
ssl_certificate     /etc/letsencrypt/live/indexrocket/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/indexrocket/privkey.pem;

# Mozilla "intermediate" profile; ECDHE only, so no ssl_dhparam file is needed.
# Note: Nginx negotiates the protocol version with the settings of the DEFAULT
# server on the :443 socket (the existing site's), so ssl_protocols here may be
# overridden by that server. This is intentional: we do not change it.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:ir_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server_tokens off;
limit_req_status 429;
