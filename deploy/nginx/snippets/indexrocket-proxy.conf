# IndexRocket — common reverse-proxy settings.
# Install to: /etc/nginx/snippets/indexrocket-proxy.conf

proxy_http_version 1.1;
proxy_set_header Connection "";          # upstream keep-alive; no WebSockets are used
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite rather than append, so a client cannot inject its own
# X-Forwarded-For. The API trusts exactly one hop (TRUST_PROXY=loopback).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# One correlation id across Nginx and API logs (the API echoes it back).
proxy_set_header X-Request-Id $request_id;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
